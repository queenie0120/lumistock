name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service to prevent free-tier spin-down
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://lumistock-l5iu.onrender.com/)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "unexpected status $code"
            exit 1
          fi
